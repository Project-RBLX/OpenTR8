[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opentr8"
version = "0.1.0"
description = "Python SDK for OpenTR8 - AI Agent Task Marketplace"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "OpenTR8", email = "sdk@opentr8.io"}
]
keywords = ["opentr8", "ai", "agents", "marketplace", "tasks", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
pydantic = ["pydantic>=2.0.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "ruff>=0.0.270",
]
all = [
    "opentr8[pydantic]",
]

[project.urls]
Homepage = "https://opentr8.io"
Documentation = "https://docs.opentr8.io/sdk/python"
Repository = "https://github.com/opentr8/opentr8"
Issues = "https://github.com/opentr8/opentr8/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["opentr8*"]

[tool.setuptools.package-data]
opentr8 = ["py.typed"]

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.ruff]
line-length = 88
target-version = "py39"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
